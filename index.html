<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fußball Flashcards</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e1e1e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="lesson-screen">
    <h1>⚽ Fußball</h1>
    <p class="lesson-subtitle">Välj lektion(er) att öva</p>
    <div class="lesson-rows">
      <div class="lesson-row all-row active" data-lesson="all">
        <span class="lesson-check">✓</span>
        <span class="lesson-label">Alla lektioner</span>
      </div>
      <div class="lesson-row active" data-lesson="1">
        <span class="lesson-check">✓</span>
        <span class="lesson-label">1 – Grundläggande</span>
        <button class="lesson-view" data-lesson="1">›</button>
      </div>
      <div class="lesson-row active" data-lesson="2">
        <span class="lesson-check">✓</span>
        <span class="lesson-label">2 – Regler &amp; situationer</span>
        <button class="lesson-view" data-lesson="2">›</button>
      </div>
      <div class="lesson-row active" data-lesson="3">
        <span class="lesson-check">✓</span>
        <span class="lesson-label">3 – Spelet</span>
        <button class="lesson-view" data-lesson="3">›</button>
      </div>
      <div class="lesson-row active" data-lesson="4">
        <span class="lesson-check">✓</span>
        <span class="lesson-label">4 – Match &amp; resultat</span>
        <button class="lesson-view" data-lesson="4">›</button>
      </div>
    </div>
    <button id="start-btn">Starta session</button>
  </div>

  <div id="word-list-screen">
    <div id="word-list-header">
      <button id="word-list-back">← Tillbaka</button>
      <h2 id="word-list-title"></h2>
    </div>
    <div id="word-list-body"></div>
  </div>

  <header>
    <h1>⚽ Fußball</h1>
    <select id="mode">
      <option value="sv-de">Svenska → Tyska</option>
      <option value="de-sv">Tyska → Svenska</option>
      <option value="mixed">Blandat</option>
    </select>
  </header>

  <div id="scoreboard">
    ⏱️ <span id="minute">1</span>'  
    ⚽ <span id="score">0–0</span>
  </div>

  <main>
    <div id="card" class="card">
      <div class="card-inner">
        <div class="card-front" id="front"></div>
        <div class="card-back" id="back"></div>
      </div>
    </div>
  </main>

  <footer>
    <p>👈 kan inte &nbsp;&nbsp; 👉 kan</p>
    <button id="change-lesson-btn">Byt lektion</button>
  </footer>

  <script src="data/vocab.js"></script>
  <script src="app.js"></script>
</body>
</html>
